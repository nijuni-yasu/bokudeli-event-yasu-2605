name: Deploy functions

permissions:
  actions: write
  contents: read

on:
  push:
    branches:
      - production
      - development
    paths:
      - 'functions/**'
      - 'common/**'
      - 'firebase.json'
      - '.github/workflows/deploy_functions.yml'
      - '.github/actions/deploy/**'
      - '.github/scripts/firebase-deploy-functions.sh'
      - '.agents/scripts/parse_failure_policy_functions.py'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - development
          - production

jobs:
  deploy:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && (github.ref_name == 'production' && 'production' || github.ref_name == 'development' && 'development') || inputs.environment }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: ./.node-version
      - name: Install dependencies
        run: npm ci
      - name: Generate .env file
        working-directory: ./functions/default
        run: echo '${{ vars.FUNCTIONS_ENV }}' | tr -d '\r' > .env
      - name: Check Format
        run: |
          npm -w common run format:check
          npm -w functions/default run format:check
      - name: Build
        run: npm -w functions/default run build
      - name: Lint
        run: |
          npm -w common run lint
          npm -w functions/default run lint
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCLOUD_SERVICE_KEY }}
          project_id: ${{ vars.PROJECT_ID }}
      - name: Deploy to Firebase
        uses: ./.github/actions/deploy
        with:
          project_id: ${{ vars.PROJECT_ID }}
          args: '--only functions'
          named_force_on_failure_policy: 'true'
      # common/** changes are deployed here first; hosting workflows are dispatched only after success.
      - name: Deploy applications after shared code
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
        run: |
          if ! git diff --name-only "$GITHUB_EVENT_BEFORE" "$GITHUB_SHA" | grep -q '^common/'; then
            exit 0
          fi
          gh workflow run deploy_user.yml --ref "$GITHUB_REF_NAME" --field environment="$ENVIRONMENT"
          gh workflow run deploy_partner.yml --ref "$GITHUB_REF_NAME" --field environment="$ENVIRONMENT"
